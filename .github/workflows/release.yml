name: SDK

on:
  pull_request:
    paths:
      - "python/**"
      - "rust/**"
      - "ffi/**"
      - "CMakeLists.txt"
      - "VERSION"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "python/**"
      - "rust/**"
      - "ffi/**"
      - "CMakeLists.txt"
      - "VERSION"
      - ".github/workflows/release.yml"
  workflow_dispatch:

jobs:
  # ── build + test (always) ──────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CCACHE_DIR: /github/home/.cache/ccache
      CCACHE_MAXSIZE: 1G
    container:
      image: eloqdata/eloq-dev-ci-ubuntu2404:latest
      options: --user root --security-opt seccomp=unconfined

    outputs:
      version: ${{ steps.read_version.outputs.version }}
      is_release: ${{ steps.detect.outputs.is_release }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix permissions
        run: chmod -R a+rwx "$GITHUB_WORKSPACE" || true

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Detect if release
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version
        id: read_version
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VER}" >> "$GITHUB_ENV"

          PY_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -n1)
          SYS_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/eloqstore-sys/Cargo.toml | head -n1)
          SDK_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/eloqstore/Cargo.toml | head -n1)
          if [ "$VER" != "$PY_VER" ] || [ "$VER" != "$SYS_VER" ] || [ "$VER" != "$SDK_VER" ]; then
            echo "Version mismatch: VERSION=$VER pyproject=$PY_VER eloqstore-sys=$SYS_VER eloqstore=$SDK_VER" >&2
            exit 1
          fi
          echo "Version consistency OK: $VER"

      - name: Validate release tag
        if: steps.detect.outputs.is_release == 'true'
        run: |
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi
          echo "Tag ${TAG} available"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/pip
          key: ${{ runner.os }}-sdk-pip-v2-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-sdk-pip-v2-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ${{ runner.os }}-sdk-ccache-v2-${{ hashFiles('CMakeLists.txt', 'ffi/**', 'include/**', 'src/**', 'rust/eloqstore-sys/**', 'python/build_hooks.py') }}
          restore-keys: |
            ${{ runner.os }}-sdk-ccache-v1-

      - name: Reset ccache stats
        run: ccache --zero-stats || true

      - name: Build Python wheel
        run: |
          python3 -m pip install build pytest twine
          python3 -m build --wheel
        working-directory: ${{ github.workspace }}/python

      - name: Run Python tests
        run: |
          ELOQSTORE_PY_LIB="$GITHUB_WORKSPACE/python/build/native/libeloqstore_capi.so" \
          PYTHONPATH="$GITHUB_WORKSPACE/python/src" \
          python3 -m pytest \
            "$GITHUB_WORKSPACE/python/tests/test_import.py" \
            "$GITHUB_WORKSPACE/python/tests/test_client_integration.py"

      - name: Verify Python wheel install
        run: |
          python3 -m pip install --no-deps --target /tmp/eloqstore-wheel-test python/dist/*.whl
          PYTHONPATH=/tmp/eloqstore-wheel-test python3 - <<'PY'
          from eloqstore import Client, Options
          client = Client(Options(table_name="demo", partition_id=0, num_threads=1))
          client.put("k", b"v")
          assert client.get("k") == b"v"
          client.close()
          PY

      - name: Run Rust integration tests
        run: cargo test -p eloqstore --test integration_test -- --nocapture --test-threads=1
        working-directory: ${{ github.workspace }}/rust

      - name: Check Rust FFI package
        run: cargo package -p eloqstore-sys --allow-dirty --no-verify
        working-directory: ${{ github.workspace }}/rust

      - name: Upload wheel artifact
        if: steps.detect.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: python/dist/*.whl

      - name: Publish eloqstore-sys to crates.io
        if: steps.detect.outputs.is_release == 'true'
        run: cargo publish -p eloqstore-sys --allow-dirty --token "${CRATES_IO_TOKEN}"
        working-directory: ${{ github.workspace }}/rust
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for eloqstore-sys index
        if: steps.detect.outputs.is_release == 'true'
        run: |
          for i in $(seq 1 60); do
            if cargo info eloqstore-sys | grep -Fq "version: ${VERSION}"; then
              exit 0
            fi
            sleep 10
          done
          echo "eloqstore-sys ${VERSION} not in crates.io index" >&2
          exit 1
        working-directory: ${{ github.workspace }}/rust

      - name: Publish eloqstore to crates.io
        if: steps.detect.outputs.is_release == 'true'
        run: cargo publish -p eloqstore --allow-dirty --token "${CRATES_IO_TOKEN}"
        working-directory: ${{ github.workspace }}/rust
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

  # ── PyPI publish (release only, bare metal for OIDC) ────────────
  python-publish:
    needs: build-and-test
    if: needs.build-and-test.outputs.is_release == 'true' && success()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── tag + GitHub Release (release only) ────────────────────────
  tag-and-release:
    needs: [build-and-test, python-publish]
    if: needs.build-and-test.outputs.is_release == 'true' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          VER='${{ needs.build-and-test.outputs.version }}'
          TAG="v${VER}"
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since ${PREV_TAG}:" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --oneline --no-merges "${PREV_TAG}..HEAD" >> CHANGELOG.md
          else
            echo "Initial release ${TAG}" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --oneline --no-merges HEAD >> CHANGELOG.md
          fi
          cat CHANGELOG.md

      - name: Create and push tag
        run: |
          TAG="v${{ needs.build-and-test.outputs.version }}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        run: |
          VER='${{ needs.build-and-test.outputs.version }}'
          TAG="v${VER}"
          cat <<EOF > release_notes.md
          ## eloqstore v${VER}

          ### Install
          \`\`\`bash
          # Python SDK
          pip install eloqstore
          \`\`\`
          \`\`\`toml
          # Rust SDK (add to Cargo.toml)
          eloqstore = "${VER}"
          \`\`\`

          ### Changelog
          EOF
          cat CHANGELOG.md >> release_notes.md

          gh release create "${TAG}" \
            --title "v${VER}" \
            --notes-file release_notes.md \
            --repo '${{ github.repository }}'
        env:
          GH_TOKEN: ${{ github.GITHUB_TOKEN }}
