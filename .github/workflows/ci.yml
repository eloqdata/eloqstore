name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: eloqdata/ubuntu-dev:24.04
      # io_uring and fixed-buffer tests need unrestricted syscalls and memlock.
      options: --user root --init --privileged --security-opt seccomp=unconfined --ulimit memlock=-1:-1
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 2G
      PIP_CACHE_DIR: /home/runner/.cache/pip
      # Shared FetchContent pool: the C++ build, the Python wheel build and the
      # Rust vendor build all resolve pinned deps from here instead of each
      # downloading and compiling their own copy.
      FETCHCONTENT_BASE_DIR: /home/runner/.cache/eloq-fetchcontent
      # Route every CMake compile (engine, wheel, rust vendor, fetched deps)
      # through the one ccache, so trees that rebuild the same sources with the
      # same flags share object caching too.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Keyed on the pin file: the cache only rotates when a dependency pin
      # (version/SHA) actually changes.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/eloq-fetchcontent
          key: ${{ runner.os }}-${{ matrix.arch }}-ubuntu-dev-fetchcontent-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Install dependencies
        run: |
          # apt reuses the image's packages and adds EloqStore-specific ones
          # such as libprotoc-dev, libzmq3-dev, and cppzmq-dev.
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/scripts/install_dependency_ubuntu2404.sh"

      # ── C++ core engine ──────────────────────────────────────────

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSKIP_CREATE_BUCKET=ON

      - name: Build C++ engine
        run: cmake --build build -j$(nproc)

      - name: Start RustFS
        run: |
          command -v rustfs
          rustfs --version
          RUSTFS_RUN_DIR=$(mktemp -d "$RUNNER_TEMP/eloqstore-rustfs.XXXXXX")
          echo "RUSTFS_RUN_DIR=$RUSTFS_RUN_DIR" >> "$GITHUB_ENV"
          mkdir -p "$RUSTFS_RUN_DIR/data"
          # Match KvOptions' existing test credentials without changing defaults.
          RUSTFS_ADDRESS=127.0.0.1:9900 \
            RUSTFS_ACCESS_KEY=minioadmin RUSTFS_SECRET_KEY=minioadmin \
            RUSTFS_CONSOLE_ENABLE=false \
            rustfs server "$RUSTFS_RUN_DIR/data" > "$RUSTFS_RUN_DIR/rustfs.log" 2>&1 &
          RUSTFS_PID=$!
          echo "RUSTFS_PID=$RUSTFS_PID" >> "$GITHUB_ENV"
          for i in {1..60}; do
            if ! kill -0 "$RUSTFS_PID" 2>/dev/null; then
              echo "RustFS exited before becoming ready" >&2
              cat "$RUSTFS_RUN_DIR/rustfs.log"
              exit 1
            fi
            if curl -fsS --noproxy '*' --max-time 2 http://127.0.0.1:9900/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "RustFS did not become ready within the startup timeout" >&2
          cat "$RUSTFS_RUN_DIR/rustfs.log"
          exit 1

      - name: Run C++ unit tests
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited || true
          ctest --test-dir build/tests/ --output-on-failure

      # ── Python SDK ────────────────────────────────────────────────

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/pip
          key: ${{ runner.os }}-${{ matrix.arch }}-ubuntu-dev-pip-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ubuntu-dev-pip-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-ubuntu-dev-ccache-${{ hashFiles('CMakeLists.txt', 'ffi/**', 'include/**', 'src/**', 'rust/eloqstore-sys/**', 'python/build_hooks.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ubuntu-dev-ccache-

      - name: Reset ccache stats
        run: ccache --zero-stats || true

      - name: Build Python wheel
        run: |
          python3 -m pip install build pytest wheel
          python3 -m build --wheel
        working-directory: ${{ github.workspace }}/python

      - name: Run Python tests
        run: |
          ELOQSTORE_PY_LIB="$GITHUB_WORKSPACE/python/build/native/libeloqstore_capi.so" \
          PYTHONPATH="$GITHUB_WORKSPACE/python/src" \
          python3 -m pytest \
            "$GITHUB_WORKSPACE/python/tests/test_import.py" \
            "$GITHUB_WORKSPACE/python/tests/test_client_integration.py"

      - name: Verify Python wheel install
        run: |
          python3 -m pip install --no-deps --target /tmp/eloqstore-wheel-test python/dist/*.whl
          PYTHONPATH=/tmp/eloqstore-wheel-test python3 - <<'PY'
          from eloqstore import Client, Options
          client = Client(Options(table_name="demo", partition_id=0, num_threads=1))
          client.put("k", b"v")
          assert client.get("k") == b"v"
          client.close()
          PY

      # ── Rust SDK ──────────────────────────────────────────────────

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-dev
          workspaces: |
            rust -> target

      - name: Build Rust SDK static example
        run: |
          cd rust
          ELOQSTORE_STATIC_EXE=1 cargo build --release --example basic_usage
          ./target/release/examples/basic_usage

      - name: Run Rust integration tests
        run: cargo test -p eloqstore --test integration_test -- --nocapture --test-threads=1
        working-directory: ${{ github.workspace }}/rust

      # ── cleanup ───────────────────────────────────────────────────

      - name: Show RustFS logs
        if: failure()
        run: |
          if [ -n "${RUSTFS_RUN_DIR:-}" ] && [ -f "$RUSTFS_RUN_DIR/rustfs.log" ]; then
            tail -n 300 "$RUSTFS_RUN_DIR/rustfs.log"
          fi

      - name: Stop RustFS and remove test data
        if: always()
        run: |
          if [ -n "${RUSTFS_PID:-}" ] && kill -0 "$RUSTFS_PID" 2>/dev/null; then
            kill "$RUSTFS_PID" || true
            timeout 15s tail --pid="$RUSTFS_PID" -f /dev/null \
              || kill -KILL "$RUSTFS_PID" 2>/dev/null || true
          fi
          if [ -n "${RUSTFS_RUN_DIR:-}" ]; then
            rm -rf "$RUSTFS_RUN_DIR"
          fi

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
