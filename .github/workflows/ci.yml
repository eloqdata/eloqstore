name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 2G
      # Shared FetchContent pool: the C++ build, the Python wheel build and the
      # Rust vendor build all resolve pinned deps from here instead of each
      # downloading and compiling their own copy.
      FETCHCONTENT_BASE_DIR: /home/runner/.cache/eloq-fetchcontent
      # Route every CMake compile (engine, wheel, rust vendor, fetched deps)
      # through the one ccache, so trees that rebuild the same sources with the
      # same flags share object caching too.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Keyed on the pin file: the cache only rotates when a dependency pin
      # (version/SHA) actually changes.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/eloq-fetchcontent
          key: ${{ runner.os }}-${{ matrix.arch }}-fetchcontent-${{ hashFiles('cmake/dependencies.cmake') }}

      - name: Install dependencies
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/scripts/install_dependency_ubuntu2404.sh"

      # ── C++ core engine ──────────────────────────────────────────

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSKIP_CREATE_BUCKET=ON

      - name: Build C++ engine
        run: cmake --build build -j$(nproc)

      - name: Start RustFS
        run: |
          # The shared image includes RustFS for both runner architectures.
          # Match KvOptions' existing test credentials without changing defaults.
          docker run --detach --name eloqstore-rustfs \
            --publish 127.0.0.1:9900:9900 \
            --env RUSTFS_ADDRESS=0.0.0.0:9900 \
            --env RUSTFS_ACCESS_KEY=minioadmin \
            --env RUSTFS_SECRET_KEY=minioadmin \
            --env RUSTFS_CONSOLE_ENABLE=false \
            --entrypoint /bin/sh \
            eloqdata/ubuntu-dev:24.04 -c 'mkdir -p /tmp/rustfs-data && exec /usr/local/bin/rustfs server /tmp/rustfs-data'
          for i in {1..60}; do
            if [ "$(docker inspect --format '{{.State.Running}}' eloqstore-rustfs)" != true ]; then
              echo "RustFS exited before becoming ready" >&2
              docker logs eloqstore-rustfs
              exit 1
            fi
            if curl -fsS --noproxy '*' --max-time 2 http://127.0.0.1:9900/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "RustFS did not become ready within the startup timeout" >&2
          docker logs eloqstore-rustfs
          exit 1

      - name: Run C++ unit tests
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited || true
          ctest --test-dir build/tests/ --output-on-failure

      # ── Python SDK ────────────────────────────────────────────────

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/pip
          key: ${{ runner.os }}-${{ matrix.arch }}-ci-pip-${{ hashFiles('python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ci-pip-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-ci-ccache-${{ hashFiles('CMakeLists.txt', 'ffi/**', 'include/**', 'src/**', 'rust/eloqstore-sys/**', 'python/build_hooks.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ci-ccache-

      - name: Reset ccache stats
        run: ccache --zero-stats || true

      - name: Build Python wheel
        run: |
          python3 -m pip install build pytest wheel
          python3 -m build --wheel
        working-directory: ${{ github.workspace }}/python

      - name: Run Python tests
        run: |
          ELOQSTORE_PY_LIB="$GITHUB_WORKSPACE/python/build/native/libeloqstore_capi.so" \
          PYTHONPATH="$GITHUB_WORKSPACE/python/src" \
          python3 -m pytest \
            "$GITHUB_WORKSPACE/python/tests/test_import.py" \
            "$GITHUB_WORKSPACE/python/tests/test_client_integration.py"

      - name: Verify Python wheel install
        run: |
          python3 -m pip install --no-deps --target /tmp/eloqstore-wheel-test python/dist/*.whl
          PYTHONPATH=/tmp/eloqstore-wheel-test python3 - <<'PY'
          from eloqstore import Client, Options
          client = Client(Options(table_name="demo", partition_id=0, num_threads=1))
          client.put("k", b"v")
          assert client.get("k") == b"v"
          client.close()
          PY

      # ── Rust SDK ──────────────────────────────────────────────────

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target

      - name: Build Rust SDK static example
        run: |
          cd rust
          ELOQSTORE_STATIC_EXE=1 cargo build --release --example basic_usage
          ./target/release/examples/basic_usage

      - name: Run Rust integration tests
        run: cargo test -p eloqstore --test integration_test -- --nocapture --test-threads=1
        working-directory: ${{ github.workspace }}/rust

      # ── cleanup ───────────────────────────────────────────────────

      - name: Show RustFS logs
        if: failure()
        run: docker logs --tail 300 eloqstore-rustfs || true

      - name: Stop RustFS and remove test data
        if: always()
        run: docker rm --force --volumes eloqstore-rustfs || true

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true
