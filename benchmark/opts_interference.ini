# EloqStore options for interference_bench (docs/design/io_qos.md M4).
#
# Append mode with small (8MB) data files so the rotating partial-overwrite
# storm pushes per-file space amplification past file_amplify_factor quickly,
# keeping compaction's move pipeline (background ReadPages bursts) busy.
#
# Sweep the M4 device rate-limit knobs below (see docs/design/io_qos.md
# "Sizing contract" and "Validation plan"):
#   disk_rate_limit_iops in {200000, 260000, 275000, 290000}  (~95% of the
#       fio-measured device ceiling is the recommended setting)
#   rate_bg_ratio        in {10, 25, 50}   (background share of the budget)
#   rate_limit_burst_ms  in {1, 2, 4}
# A/B the limiter by setting disk_rate_limit_iops = 0 (off) versus a
# calibrated value; the deprecated count knobs (max_inflight_read,
# bg_read_ratio, max_inflight_write) no longer affect device admission.

# Note: run interference_bench with --partitions >= num_threads, or some
# shards sit idle and their RESULT qos lines read zero.

[run]
num_threads = 4
buffer_pool_size = 400MB
fd_limit = 5000
num_retained_archives = 0
skip_verify_checksum = true

# --- M4 device rate limit under test ---
disk_rate_limit_iops = 275000
rate_bg_ratio = 25
rate_limit_burst_ms = 2
rate_limit_io_unit = 4KB
# max_inflight_io = 0        # optional class-blind in-flight window

[permanent]
store_path = /tmp/eloqstore_interference
data_page_size = 4KB
data_file_size = 8MB
data_append_mode = true
